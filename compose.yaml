
services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workpilot-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/workpilot
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: workpilot-db
    environment:
      POSTGRES_DB: workpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - workpilot-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workpilot-db-data:
